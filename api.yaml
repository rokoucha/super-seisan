components:
  schemas:
    SeisanResultDetailItem:
      type: object
      properties:
        id:
          type: string
          description: ID
        source:
          $ref: "#/components/schemas/Item"
          description: 項目
        subtotal:
          type: number
          description: 小計
      required:
        - id
        - source
        - subtotal
    SeisanResultDetail:
      type: object
      properties:
        id:
          type: string
          description: ID
        participant:
          $ref: "#/components/schemas/Participant"
          description: 参加者
        total:
          type: number
          description: 合計
        paid:
          type: number
          description: 支払い済額
        difference:
          type: number
          description: 差額
      required:
        - id
        - participant
        - total
        - paid
        - difference
    SeisanResult:
      type: object
      properties:
        id:
          type: string
          description: ID
        surplus:
          type: number
          description: 余り
        details:
          type: array
          items:
            $ref: "#/components/schemas/SeisanResultDetailItem"
          description: 参加者ごとの詳細
      required:
        - id
        - surplus
        - details
    Currency:
      type: object
      properties:
        id:
          type: string
          description: ID
        code:
          type: string
          description: 通貨名
        rate:
          type: number
          description: 対円レート
        createdAt:
          type: string
          description: 作成日時
        updatedAt:
          type: string
          description: 更新日時
      required:
        - id
        - code
        - rate
        - createdAt
        - updatedAt
    Participant:
      type: object
      properties:
        id:
          type: string
          description: ID
        name:
          type: string
          description: 名前
        icon:
          type: string
          description: アイコン
        createdAt:
          type: string
          description: 作成日時
        updatedAt:
          type: string
          description: 更新日時
      required:
        - id
        - name
        - icon
        - createdAt
        - updatedAt
    Item:
      type: object
      properties:
        id:
          type: string
          description: ID
        name:
          type: string
          description: 名前
        icon:
          type: string
          description: アイコン
        payer:
          $ref: "#/components/schemas/Participant"
          description: 参加者
        price:
          type: number
          description: 単価
        currency:
          anyOf:
            - $ref: "#/components/schemas/Currency"
            - type: "null"
          description: 通貨
        amount:
          type: integer
          description: 個数
        total:
          type: number
          description: 小計
        exempts:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
            description: 参加者
          description: 割り勘から除外する参加者
        version:
          type: string
          description: バージョン
        createdAt:
          type: string
          description: 作成日時
        updatedAt:
          type: string
          description: 更新日時
      required:
        - id
        - name
        - icon
        - payer
        - price
        - amount
        - total
        - exempts
        - version
        - createdAt
        - updatedAt
    Seisan:
      type: object
      properties:
        id:
          type: string
          description: ID
        name:
          type: string
          description: 名前
        icon:
          type: string
          description: アイコン
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
            description: 項目
          description: 精算項目
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
            description: 参加者
          description: 参加者
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/Currency"
          description: 通貨
        result:
          $ref: "#/components/schemas/SeisanResult"
          description: 精算結果
        createdAt:
          type: string
          description: 作成日時
        updatedAt:
          type: string
          description: 更新日時
      required:
        - id
        - name
        - icon
        - items
        - participants
        - currencies
        - result
        - createdAt
        - updatedAt
    SeisanInput:
