name: CI - Web

on:
  push:
    paths:
      - .github/workflows/ci-web.yml
      - api.yaml
      - web/**

defaults:
  run:
    working-directory: web

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Check formatting
        run: pnpm run lint

      - name: Check types
        run: pnpm run type-check

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Run build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Run tests
        run: pnpm run test
