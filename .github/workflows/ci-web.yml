name: CI - Web

on:
  push:
    paths:
      - .github/workflows/ci-web.yml
      - api.yaml
      - web/**

defaults:
  run:
    working-directory: web

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Check formatting
        run: pnpm run lint

      - name: Check types
        run: pnpm run type-check

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Run build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: ./web/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web

      - name: Install dependencies
        run: pnpm i

      - name: Generate codes
        run: pnpm run generate

      - name: Run tests
        run: pnpm run test
